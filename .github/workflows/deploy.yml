
name: Deploy SatTrack

on:
  push:
    branches:
      - main

  schedule:
    - cron: "17 */3 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site/TLE
          cp -a docs/. _site/
          touch _site/.nojekyll

      - name: Download TLE files
        shell: bash
        run: |
          set -euo pipefail

          groups=(
            weather
            geo
            starlink
            oneweb
            stations
            last-30-days
            molniya
            active
          )

          for group in "${groups[@]}"; do
            echo "Downloading ${group}..."

            url="https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=tle"
            output="_site/TLE/${group}.txt"

            curl --fail --location --silent --show-error \
              --retry 3 \
              --retry-delay 5 \
              --max-time 120 \
              "$url" -o "$output"

            if ! grep -q '^1 ' "$output" || ! grep -q '^2 ' "$output"; then
              echo "Invalid TLE data received for ${group}"
              exit 1
            fi

            echo "Saved ${output}"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
